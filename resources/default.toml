[colors]
border    = "#554040"
head      = "#45E00B"
message   = "#DDDDDD"
author    = "#0BE0CE"
# The option under the cursor, and any ticked with space under --multiple.
selection = "#ED0800"
# Set footer to "<hidden>" to drop the key hints from the bottom of the popup.
footer    = "#874BFD"
# Notifications whose caller stopped waiting for an answer.
expired   = "#6C6C6C"

[sidepanel]
# direction: <left|right>
direction = "right"
width     = 40
# The time each notification arrived, drawn in the top border of its box.
# clock takes "24h", "12h", or a Go time layout of your own ("3:04 PM").
clock     = "24h"
# date is added to notifications that did not arrive today, and takes "dmy",
# "mdy", "ymd"/"iso", or a layout ("02/01/2006").
# Set either to "<hidden>" to leave that part off.
date      = "dmy"

[overlay]
# location: <top|middle|bottom>-<left|center|right>
location   = "top-right"
timeout    = 0
# The popup is sized to the message, in columns and rows. It starts at
# min_width/min_height and widens towards max_width first; only once that is
# not enough does it grow taller, up to max_height. A zero bound means no
# limit beyond the size of the terminal.
min_width  = 40
max_width  = 80
min_height = 0
max_height = 0

